<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnCloud | Learn in the cloud</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1220; --panel: #121d31; --muted: #9badc9; --text: #eef4ff; --accent: #63e6be; --accent-2: #7aa2ff; --danger: #ff8c8c; }
    * { box-sizing: border-box; } body { margin: 0; font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 15% 0%, #18335c, transparent 38%), var(--bg); }
    .shell { width: min(1080px, calc(100% - 32px)); margin: auto; padding: 48px 0 72px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 40px; } .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: .75rem; font-weight: 700; }
    h1 { font-size: clamp(2.2rem, 6vw, 4.6rem); line-height: .95; margin: 10px 0 16px; letter-spacing: -.06em; } h2 { margin-top: 0; } .intro { color: var(--muted); max-width: 550px; }
    .student { min-width: 250px; } label { display: block; color: var(--muted); font-size: .82rem; margin-bottom: 7px; } input { width: 100%; border: 1px solid #2b3d5d; border-radius: 10px; padding: 12px; background: #0e182b; color: var(--text); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; } .card, .lesson { background: rgba(18, 29, 49, .88); border: 1px solid #223451; border-radius: 16px; padding: 22px; box-shadow: 0 14px 40px #0003; }
    .card { cursor: pointer; transition: transform .2s, border-color .2s; } .card:hover { transform: translateY(-3px); border-color: var(--accent-2); } .card p, .lesson p { color: var(--muted); }
    .course-view { margin-top: 28px; } .lesson { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 0; } .lesson h3 { margin: 0; font-size: 1rem; } .lesson p { margin: 4px 0 0; font-size: .88rem; }
    button, .link { border: 0; border-radius: 9px; padding: 10px 14px; color: #07131b; background: var(--accent); font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; } button:disabled { opacity: .55; cursor: default; }
    .link { background: #243b69; color: var(--text); } .error { color: var(--danger); min-height: 24px; margin: 18px 0; } .status { color: var(--accent); font-size: .9rem; } .empty { color: var(--muted); }
    @media (max-width: 700px) { header { display: block; } .student { margin-top: 24px; } .lesson { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">LearnCloud / your learning space</div><h1>Build skills.<br><em>Ship boldly.</em></h1><p class="intro">Short, focused lessons for building confidence in cloud technology.</p></div>
      <div class="student"><label for="student-id">Student ID</label><input id="student-id" maxlength="64" placeholder="e.g. alex@example.com" autocomplete="off"></div>
    </header>
    <div id="error" class="error" role="alert"></div>
    <section><div class="eyebrow">Explore</div><h2>Courses</h2><div id="courses" class="grid"><p class="empty">Loading courses...</p></div></section>
    <section id="course-view" class="course-view" hidden></section>
  </main>
  <script>
    const API_URL = "https://3m23zmtswd.execute-api.eu-north-1.amazonaws.com";
    const courses = document.querySelector("#courses");
    const courseView = document.querySelector("#course-view");
    const errorBox = document.querySelector("#error");
    const studentInput = document.querySelector("#student-id");
    studentInput.value = localStorage.getItem("learncloud_student_id") || "";
    studentInput.addEventListener("change", () => localStorage.setItem("learncloud_student_id", studentInput.value.trim()));

    function showError(message) { errorBox.textContent = message; }
    async function api(path, options) {
      if (API_URL === "REPLACE_WITH_API_URL") throw new Error("Set API_URL in frontend/index.html before deploying.");
      const result = await fetch(`${API_URL.replace(/\/$/, "")}${path}`, options);
      const data = await result.json().catch(() => ({}));
      if (!result.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }
    function renderCourses(items) {
      courses.innerHTML = items.length ? items.map(course => `<article class="card" data-course="${encodeURIComponent(course.course_id)}"><div class="eyebrow">${course.course_id}</div><h3>${course.title}</h3><p>${course.description}</p><span class="status">View lessons →</span></article>`).join("") : '<p class="empty">No courses yet.</p>';
      courses.querySelectorAll("[data-course]").forEach(card => card.addEventListener("click", () => loadCourse(decodeURIComponent(card.dataset.course))));
    }
    async function loadCourse(courseId) {
      showError(""); courseView.hidden = false; courseView.innerHTML = "<p>Loading lessons...</p>";
      try {
        const course = await api(`/courses/${encodeURIComponent(courseId)}`);
        courseView.innerHTML = `<div class="eyebrow">${course.course_id}</div><h2>${course.title}</h2><p class="intro">${course.description}</p><div>${course.lessons.map(lesson => `<article class="lesson"><div><h3>${lesson.title}</h3><p>${lesson.lesson_id}</p></div><div><a class="link" href="/${lesson.material_key}" target="_blank" rel="noopener">Open</a> <button data-lesson="${lesson.lesson_id}">Mark complete</button></div></article>`).join("")}</div>`;
        courseView.querySelectorAll("[data-lesson]").forEach(button => button.addEventListener("click", () => complete(course.course_id, button.dataset.lesson, button)));
        courseView.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (error) { courseView.hidden = true; showError(error.message); }
    }
    async function complete(courseId, lessonId, button) {
      const studentId = studentInput.value.trim();
      if (!studentId) { showError("Enter a student ID before marking a lesson complete."); studentInput.focus(); return; }
      button.disabled = true;
      try { await api("/progress", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ student_id: studentId, course_id: courseId, lesson_id: lessonId }) }); button.textContent = "Completed"; }
      catch (error) { button.disabled = false; showError(error.message); }
    }
    api("/courses").then(renderCourses).catch(error => { courses.innerHTML = ""; showError(error.message); });
  </script>
</body>
</html>
